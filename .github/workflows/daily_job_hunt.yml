name: Daily AI Job Hunter Automation

on:
  schedule:
    # Runs at 13:20 UTC (06:50 PM IST)
    - cron: '20 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  job-hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google Drive Token in Cloud Runner
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
        run: |
          mkdir -p config
          python -c "import os, sys; token = os.environ.get('GDRIVE_TOKEN_JSON', '').strip(); (open('config/token.json', 'w', encoding='utf-8').write(token), print('[+] Google Drive token written to config/token.json')) if token else print('[-] GDRIVE_TOKEN_JSON secret is empty or not set in GitHub Secrets.')"

      - name: Run Daily Job Hunter Pipeline
        env:
          RESUME_PATH: ${{ secrets.RESUME_PATH || 'resume/sample_resume.md' }}
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED || 'true' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp-relay.brevo.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          GDRIVE_ENABLED: ${{ secrets.GDRIVE_ENABLED || 'true' }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || '1_iBWaeS4WkDJdIjpclBEZaulgPbV5M2F' }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED || 'false' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIN_MATCH_SCORE: '70'
          TARGET_DAILY_JOBS: '50'
        run: |
          python main.py --run-now

      - name: Upload Daily Excel Report as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Job-Report
          path: reports/*.xlsx
          retention-days: 30
